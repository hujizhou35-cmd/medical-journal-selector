name: 问题反馈 / Bug report
description: 报告安装、规则或证据处理问题；不要提交未公开稿件或密钥。
body:
  - type: input
    id: host
    attributes:
      label: Agent 与版本
      placeholder: 例如 Codex / Claude Code，以及 Skill 版本
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题和期望结果
      description: 使用虚构材料或可公开的来源链接，说明怎样复现。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我没有附上未公开稿件、患者资料、凭据或无权分享的数据。
          required: true
