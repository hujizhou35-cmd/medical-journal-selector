name: Report a problem
description: Report an installation, rule or evidence-handling problem.
body:
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Include the Skill version and your AI host.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Steps, expected result and actual result
      description: Use fictional examples or shareable source links. Include access dates for policy claims.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public material
      options:
        - label: I have not included unpublished manuscripts, patient information, credentials or restricted data.
          required: true
