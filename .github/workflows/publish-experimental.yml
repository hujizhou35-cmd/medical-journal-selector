name: Verify release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python development/check_project.py
      - run: python development/build_release.py --target stable
      - run: python development/build_release.py --target experimental
      - run: python development/build_release.py --target trainer
      - uses: actions/upload-artifact@v4
        with:
          name: checked-install-packages
          path: |
            dist/stable/*
            dist/experimental/*
            dist/trainer/*
